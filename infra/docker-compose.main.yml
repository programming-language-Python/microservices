name: orderflow

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api-gateway:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    expose:
      - "80"

  mongodb:
    image: mongo:8.0
    # отключение логов
    attach: false
    command: [ "--quiet" ]
    #
    logging:
      driver: "none"
    environment:
      MONGO_INITDB_ROOT_USERNAME: analytics
      MONGO_INITDB_ROOT_PASSWORD: analytics # поменять
    expose:
      - "27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      # поменять
      test: [ "CMD", "mongosh", "--quiet", "--username", "analytics", "--password", "analytics", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U catalog -d catalog" ]
      interval: 3s
      timeout: 3s
      retries: 30

  order-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orders -d orders" ]
      interval: 3s
      timeout: 3s
      retries: 30

  payment-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payments -d payments" ]
      interval: 3s
      timeout: 3s
      retries: 30

  notification-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notifications -d notifications" ]
      interval: 3s
      timeout: 3s
      retries: 30

  auth-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth -d auth" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orderflow
      RABBITMQ_DEFAULT_PASS: orderflow
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      #      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 3s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_BIND_HOST}:9092:9092"
    environment:
      # базовый шаблон kafka
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list" ]
      interval: 5s
      timeout: 10s
      retries: 10

  catalog-service:
    build: ../catalog-service
    environment:
      DATABASE_URL: postgresql+psycopg2://catalog:catalog@catalog-db:5432/catalog
    ports:
      - "8001:8000"
    depends_on:
      catalog-db:
        condition: service_healthy

  payment-service:
    build: ../payment-service
    environment:
      DATABASE_URL: postgresql+asyncpg://payments:payments@payment-db:5432/payments
      RABBITMQ_URL: amqp://orderflow:orderflow@rabbitmq:5672/
      PAYMENT_EXCHANGE_NAME: payment.evenvs
      PAYMENT_SUCCEEDED_ROUTING_KEY: payment.succeeded
    ports:
      - "8003:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytic-service:
    build:
      context: ../analytic-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: payment-events
      MONGODB_URL: mongodb://analytics:analytics@mongodb:27017/?authService=admin
      MONGODB_DATABASE: analytics
      MONGODB_COLLECTION: events
    ports:
      - "${ANALYTIC_SERVICE_PORT:-8005}:8000"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  order-service:
    build: ../order-service
    environment:
      DATABASE_URL: postgresql+psycopg2://orders:orders@order-db:5432/orders
      CATALOG_SERVICE_URL: http://catalog-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      RABBITMQ_URL: amqp://orderflow:orderflow@rabbitmq:5672/
      PAYMENT_EXCHANGE_NAME: payment.evenvs
      PAYMENT_QUEUE_NAME: payment.results
      PAYMENT_SUCCEEDED_ROUTING_KEY: payment.succeeded
    ports:
      - "8002:8000"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
      payment-service:
        condition: service_started

  notification-service:
    build: ../notification-service
    environment:
      DATABASE_URL: postgresql+asyncpg://notifications:notifications@notification-db:5432/notifications
      CATALOG_SERVICE_URL: http://catalog-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      RABBITMQ_URL: amqp://orderflow:orderflow@rabbitmq:5672/
      PAYMENT_EXCHANGE_NAME: payment.evenvs
      NOTIFICATION_QUEUE_NAME: notification.results
      PAYMENT_SUCCEEDED_ROUTING_KEY: payment.succeeded
    ports:
      - "8004:8000"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started
      payment-service:
        condition: service_started
      order-service:
        condition: service_started

  auth-service:
    build: ../auth-service
    environment:
      DATABASE_URL: postgresql+psycopg2://auth:auth@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET:-orderflow-local-jwt-secret-change-me}
      JWT_ALGORITHM: HS256
    depends_on:
      auth-db:
        condition: service_healthy

  api-gateway:
    build: ../api-gateway
    environment:
      DATABASE_URL: postgresql+psycopg2://orders:orders@order-db:5432/orders
      CATALOG_SERVICE_URL: http://catalog-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      AUTH_SERVICE_URL: http://auth-service:8000
      JWT_SECRET: ${JWT_SECRET:-orderflow-local-jwt-secret-change-me}
      JWT_ALGORITHM: HS256
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started