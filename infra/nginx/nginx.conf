server {
    listen 80; # порт
    server_name _; # домен

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api-gateway:8000; # проксируем запросы
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://frontend:80; # проксируем запросы
    }
}